name: 01-xid79-evacuate
description: >
  单卡掉总线（NVIDIA Xid 79）。节点级致命故障：应紧急保存检查点、把作业迁到
  备用节点、隔离原节点，并从最近检查点续训；RPO 受检查点间隔约束。
job:
  steps: 120
  world_size: 2
  step_sleep: 0.05
  ckpt_every: 20
  node: gpu-node-15
  spare_nodes: [gpu-node-16]
injections:
  - {at_step: 40, action: die_rank, rank: 1}
  - at_step: 40
    action: event
    vendor: nvidia
    code: "79"
    text: "NVRM: Xid (PCI:0000:2d:00): 79, pid='4242', name=python, GPU has fallen off the bus."
expect:
  any_strategy: [evacuate, migrate]
  max_rpo_steps: 20
  min_recoveries: 1
